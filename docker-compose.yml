# Local/pilot stack: Postgres + API + frontend.
#   cp .env.example .env   # fill in SECRET_KEY and POSTGRES_PASSWORD at least
#   docker compose up --build
# Required secrets have no default: compose refuses to start without them.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aegis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Database reachable only from this machine (not from the network).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@db:5432/aegis_db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>= 32 characters) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AEGIS_ALLOW_MOCKS: ${AEGIS_ALLOW_MOCKS:-0}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
