version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aegis:aegis@db:5432/aegis_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      RPC_URL: ${RPC_URL:-http://localhost:8545}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      AEGIS_CONTRACT_ADDRESS: ${AEGIS_CONTRACT_ADDRESS:-}
      EURC_TOKEN_ADDRESS: ${EURC_TOKEN_ADDRESS:-}
      CHAIN_ID: ${CHAIN_ID:-80002}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
