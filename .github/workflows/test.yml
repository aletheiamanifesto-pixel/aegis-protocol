name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install "setuptools>=69.0"
          pip install -r requirements.txt -r requirements-dev.txt pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: test-secret-key-for-ci-only
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  contracts-and-circuits:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Committed verifiers match the circuits
        run: |
          npm run build:circuits
          git diff --exit-code contracts/verifiers/

      - name: Solidity tests (Hardhat, includes on-chain verification of real proofs)
        run: npx hardhat test

      - name: Noir circuit tests (includes a real UltraHonk proof)
        run: npm run test:circuits

  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Next.js build (type check included)
        run: npx next build

  stack-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Generate secrets for the run
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env

      - name: docker compose up (db + api + frontend)
        run: docker compose up --build -d --wait --wait-timeout 600

      - name: End-to-end smoke test
        run: |
          python3 -m pip install --quiet "httpx>=0.28,<1" "eth-account==0.10.0"
          python3 scripts/e2e_smoke.py http://localhost:8000 http://localhost:3000

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
